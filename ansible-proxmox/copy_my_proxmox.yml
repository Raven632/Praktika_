---
plugin: community.proxmox.proxmox
url: https://192.0.2.10:8006     
user: root@pam
api_password: "{{ lookup('env', 'PROXMOX_PASSWORD') }}"
api_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
api_user: "{{ lookup('env', 'PROXMOX_USER') }}"
validate_certs: false             
want_facts: true 
compose:
  ansible_host: >-
    ((proxmox_agent_interfaces | default([]) | selectattr('name', 'equalto', 'ens18') | list | first | default({})).get('ip-addresses', []) | first | default(inventory_hostname)) | regex_replace('/.*', '')